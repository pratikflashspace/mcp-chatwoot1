name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health to keep Render free-tier instance warm
        run: |
          curl -fsSL --max-time 90 -w '\nhttp %{http_code} in %{time_total}s\n' \
            https://chatwoot-mcp.onrender.com/health
